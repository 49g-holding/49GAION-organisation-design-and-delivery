# Checks of this assembly repository, on every pull request and on main: the one set of checks of the
# Library repositories, the action `library-checks` of 49GAION-protocol, run at the commit in
# PROTOCOL-PIN (every `uses:` line below must name the same commit; the `pin` check fails if not).
# pins: tools/check_pins.py reads every pin of this assembly back.
# no-persian: no Persian or Arabic-script character in any tracked file, the PR title or the PR body.
# no-org-names: the scanner of 49GAION-protocol at the pin finds no organisation name, host or code.
# no-binaries: a binary file is never added. dr-frozen: a decision record on main never changes.
# The pin moves by a pull request that changes PROTOCOL-PIN and every uses line together.
name: checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: 49g-holding/49GAION-protocol/.github/actions/library-checks@f74d117b820b265875366cf736c9a6acbdaeeb0e
        with:
          check: pin

  pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: 49g-holding/49GAION-protocol/.github/actions/library-checks@f74d117b820b265875366cf736c9a6acbdaeeb0e
        with:
          check: pins

  no-persian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: 49g-holding/49GAION-protocol/.github/actions/library-checks@f74d117b820b265875366cf736c9a6acbdaeeb0e
        with:
          check: no-persian

  no-org-names:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: 49g-holding/49GAION-protocol/.github/actions/library-checks@f74d117b820b265875366cf736c9a6acbdaeeb0e
        with:
          check: no-org-names

  no-binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: 49g-holding/49GAION-protocol/.github/actions/library-checks@f74d117b820b265875366cf736c9a6acbdaeeb0e
        with:
          check: no-binaries

  dr-frozen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: 49g-holding/49GAION-protocol/.github/actions/library-checks@f74d117b820b265875366cf736c9a6acbdaeeb0e
        with:
          check: dr-frozen
